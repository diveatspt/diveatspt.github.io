const root=document.getElementById('view'), euro=n=>(n/100).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
const menu=[{n:'Hambúrguer artesanal',p:1250,q:2,e:'🍔'},{n:'Pizza Margherita',p:1100,q:1,e:'🍕'},{n:'Batatas fritas',p:450,q:1,e:'🍟'},{n:'Limonada',p:350,q:3,e:'🍋'},{n:'Brownie',p:500,q:2,e:'🍫'}];
const total=menu.reduce((s,x)=>s+x.p*x.q,0),accounts={};let restaurant='Bistro 21',table='4',key='',mode='items',selected=[],shares=[],people=3,method='digital';
function account(){return accounts[key]||(accounts[key]={paid:0,used:menu.map(()=>0),equal:null})}
function home(){root.innerHTML='<section class="hero"><div><span class="tag accent">A NOVA FORMA DE PAGAR À MESA</span><h1>A mesa é de todos.<br><span class="accent">A conta é de cada um.</span></h1><p>Aproxima o telemóvel, escolhe o que consumiste e paga a tua parte. Sem aplicações. Sem contas complicadas.</p><div class="actions"><button class="light" onclick="clients()">Sou cliente ↗</button><button class="alt" onclick="business()">Tenho um restaurante ↗</button></div></div><div><div class="mock"><span class="pill">● Mesa 04</span><h2>A tua conta</h2><div class="row">🍔 Hambúrguer <b>12,50 €</b></div><div class="row">🍋 Limonada <b>3,50 €</b></div><div class="row">🍟 Batatas a dividir <b>2,25 €</b></div><p class="muted">A tua parte</p><div class="amount">18,25 €</div><button class="full" onclick="enter()">Pagar a minha parte</button></div></div></section><section class="audiences"><span class="tag">ESCOLHE O TEU PERCURSO</span><h2>Uma solução. Dois lados da mesa.</h2><div class="steps"><div class="tile"><span class="num">01</span><h3>Para clientes</h3><p>Consulta a conta da mesa, divide os consumos e paga a tua parte.</p><button onclick="clients()">Área de cliente →</button></div><div class="tile"><span class="num">02</span><h3>Para restaurantes</h3><p>Abre contas, acompanha saldos e gere as mesas num único painel.</p><button onclick="business()">Área de restaurante →</button></div></div></section><section id="how"><span class="tag">SIMPLES POR NATUREZA</span><h2>Três passos. Zero confusão.</h2><div class="steps"><div class="tile"><span class="num">1</span><h3>Aproxima</h3><p>Encosta o telemóvel ao dispositivo NFC da mesa.</p></div><div class="tile"><span class="num">2</span><h3>Divide</h3><p>Escolhe os teus consumos ou divide a conta por todos.</p></div><div class="tile"><span class="num">3</span><h3>Paga</h3><p>Paga digitalmente ou no restaurante.</p></div></div></section><section style="background:#e4edda"><h2>O futuro está à mesa.</h2><p>Um dispositivo modular magnético com tecnologia NFC que liga cada cliente à conta da sua mesa.</p><button onclick="business()">DivEats para restaurantes ↗</button></section>'}
function clients(){root.innerHTML=`<section class="screen"><span class="tag">DIVEATS PARA CLIENTES</span><h2>A tua parte, à tua maneira.</h2><p>Aproxima o telemóvel da tag NFC da mesa ou experimenta o acesso de demonstração.</p><div class="steps"><div class="tile"><h3>Escolhe</h3>Seleciona o que consumiste.</div><div class="tile"><h3>Partilha</h3>Divide pratos ou o saldo total.</div><div class="tile"><h3>Paga</h3>Confirma a tua parte.</div></div><p><button class="light full" onclick="enter()">Aceder à conta da mesa →</button></p><p class="muted">PIN de demonstração: 1234</p></section>`;window.scrollTo(0,0)}
function how(){home();document.getElementById('how').scrollIntoView({behavior:'smooth'})}
function enter(){root.innerHTML='<section class="screen"><button class="alt" onclick="home()">← Início</button><h2>Entra na tua mesa</h2><p>Simulação da leitura de uma tag NFC.</p><form class="tile" onsubmit="event.preventDefault();login()"><label>Restaurante<select id="rest"><option>Bistro 21</option><option>Casa da Pizza</option></select></label><label>Mesa<select id="table"><option>4</option><option>1</option><option>2</option><option>3</option></select></label><label>PIN da mesa<input id="pin" inputmode="numeric" maxlength="4" placeholder="Introduz os 4 dígitos" required></label><div class="notice">PIN de demonstração: <b>1234</b></div><p class="error" id="error"></p><button class="full">Entrar na conta →</button></form><p class="muted">Dados fictícios. Sem transações reais.</p></section>';let p=new URLSearchParams(location.search);if(['Bistro 21','Casa da Pizza'].includes(p.get('restaurante')))document.getElementById('rest').value=p.get('restaurante');if(['1','2','3','4'].includes(p.get('mesa')))document.getElementById('table').value=p.get('mesa')}
function login(){if(document.getElementById('pin').value!=='1234'){document.getElementById('error').textContent='PIN incorreto. Experimenta 1234.';return}restaurant=document.getElementById('rest').value;table=document.getElementById('table').value;key=restaurant+'/'+table;reset();bill()}
function reset(){selected=menu.map(()=>0);shares=menu.map(()=>1);mode=account().equal?'equal':'items'}
function balance(){return total-account().paid}
function cost(){let a=account();if(mode==='equal'){let e=a.equal||{amount:balance(),people,next:0};return Math.floor(e.amount/e.people)+(e.next<e.amount%e.people?1:0)}return menu.reduce((s,x,i)=>s+Math.round(x.p*(a.used[i]+selected[i]/shares[i]))-Math.round(x.p*a.used[i]),0)}
function bill(){let a=account(),r=balance();root.innerHTML='<section class="screen"><button class="alt" onclick="enter()">← Trocar de mesa</button><p class="muted">'+restaurant+' · Mesa '+table+'</p><h2>A conta da mesa</h2><div class="total">Total da conta<div class="amount">'+euro(total)+'</div><div class="row">Já pago <b>'+euro(a.paid)+'</b></div><div class="row">Por pagar <b>'+euro(r)+'</b></div></div>'+(r===0?'<div class="notice">✓ Conta totalmente liquidada.</div><button onclick="home()">Início</button>':'<div class="actions"><button class="'+(mode==='items'?'':'alt')+'" onclick="switchMode(\'items\')" '+(a.equal?'disabled':'')+'>Os meus consumos</button><button class="'+(mode==='equal'?'':'alt')+'" onclick="switchMode(\'equal\')">Dividir igualmente</button></div><div id="choices"></div><div class="total">A tua parte<div class="amount" id="sum">'+euro(cost())+'</div><button class="light full" id="pay" onclick="checkout()">Continuar para pagamento →</button></div>')+'<p class="muted">Demonstração · Sem pagamentos reais.</p></section>';if(r>0){choices();refresh()}}
function switchMode(m){mode=m;bill()}
function choices(){let a=account(),c=document.getElementById('choices');if(mode==='equal'){c.innerHTML=a.equal?'<div class="notice">Parte '+(a.equal.next+1)+' de '+a.equal.people+'</div>':'<div class="tile"><label>Número de pessoas<select onchange="people=+this.value;refresh()">'+Array.from({length:7},(_,i)=>'<option value="'+(i+2)+'" '+(people===i+2?'selected':'')+'>'+(i+2)+' pessoas</option>').join('')+'</select></label></div>';return}c.innerHTML=menu.map((x,i)=>'<div class="row"><div><b>'+x.e+' '+x.n+'</b><div class="muted">'+euro(x.p)+' / unidade · '+Math.max(0,x.q-a.used[i]).toFixed(2)+' disponível</div><label class="muted">Partilhar por <select style="width:auto;padding:4px;margin:5px" onchange="share('+i+',+this.value)">'+[1,2,3,4,5,6].map(n=>'<option '+(shares[i]===n?'selected':'')+'>'+n+'</option>').join('')+'</select> pessoa(s)</label></div><div class="qty"><button onclick="change('+i+',-1)" '+(!selected[i]?'disabled':'')+'>−</button><b>'+selected[i]+'</b><button onclick="change('+i+',1)" '+(a.used[i]+(selected[i]+1)/shares[i]>x.q+1e-8?'disabled':'')+'>+</button></div></div>').join('')}
function share(i,n){shares[i]=n;selected[i]=0;choices();refresh()}
function change(i,d){let n=selected[i]+d;if(n<0||account().used[i]+n/shares[i]>menu[i].q+1e-8)return;selected[i]=n;choices();refresh()}
function refresh(){document.getElementById('sum').textContent=euro(cost());document.getElementById('pay').disabled=cost()<=0||cost()>balance()}
function checkout(){if(cost()<=0||cost()>balance())return;method='digital';root.innerHTML='<section class="screen"><button class="alt" onclick="bill()">← Voltar à conta</button><h2>Como queres pagar?</h2><div class="total">A tua parte<div class="amount">'+euro(cost())+'</div></div><div class="tile"><label><input style="width:auto" type="radio" name="payment" checked onchange="method=\'digital\'"> Pagamento digital simulado</label><label><input style="width:auto" type="radio" name="payment" onchange="method=\'local\'"> Pagar no restaurante</label></div><div class="notice">Não serão efetuadas transações reais.</div><button class="full" onclick="confirmPay()">Confirmar simulação</button></section>'}
function confirmPay(){let a=account(),amount=cost();if(amount<=0||amount>balance())return;if(mode==='equal'){if(!a.equal)a.equal={amount:balance(),people,next:0};a.equal.next++}else selected.forEach((q,i)=>a.used[i]+=q/shares[i]);a.paid+=amount;root.innerHTML='<section class="screen" style="text-align:center"><div style="font-size:60px;color:#79a83e">✓</div><h2>Pagamento '+(method==='local'?'presencial ':'')+'simulado!</h2><div class="amount">'+euro(amount)+'</div><p>Saldo restante: <b>'+euro(balance())+'</b></p><button onclick="reset();bill()">Continuar para outra pessoa</button><p><button class="alt" onclick="home()">Início</button></p></section>'}
let staffRestaurant='Bistro 21';
function business(){root.innerHTML='<section class="screen"><span class="tag">DIVEATS PARA RESTAURANTES</span><h2>O teu restaurante, num só painel.</h2><p>Gere contas e acompanha pagamentos por mesa.</p><div class="tile"><label>Restaurante<select onchange="staffRestaurant=this.value;dashboard()"><option '+(staffRestaurant==='Bistro 21'?'selected':'')+'>Bistro 21</option><option '+(staffRestaurant==='Casa da Pizza'?'selected':'')+'>Casa da Pizza</option></select></label><div id="dashboard"></div></div><p class="muted">Área de gestão demonstrativa, sem autenticação real. As contas são fictícias e existem apenas nesta sessão.</p></section>';dashboard();window.scrollTo(0,0)}
function dashboard(){let keys=Object.keys(accounts).filter(k=>k.startsWith(staffRestaurant+'/')), paid=keys.reduce((s,k)=>s+accounts[k].paid,0);document.getElementById('dashboard').innerHTML='<div class="steps"><div class="tile">Mesas abertas<h2>'+keys.filter(k=>accounts[k].paid<total).length+'</h2></div><div class="tile">Recebido (simulado)<h2>'+euro(paid)+'</h2></div></div><h3>Gestão de mesas</h3><div class="steps">'+[1,2,3,4].map(n=>{let a=accounts[staffRestaurant+'/'+n];return '<div class="tile"><h3>Mesa '+n+'</h3><span class="pill">'+(!a?'Livre':a.paid===total?'Liquidada':'Aberta')+'</span>'+(a?'<div class="row">Total <b>'+euro(total)+'</b></div><div class="row">Pago <b>'+euro(a.paid)+'</b></div><div class="row">Em falta <b>'+euro(total-a.paid)+'</b></div><p><button class="alt" onclick="staffLink('+n+')">Copiar link NFC</button></p><button class="alt" onclick="staffDetail('+n+')">Ver consumos</button>': '<p><button onclick="staffOpen('+n+')">Abrir conta</button></p>')+'</div>'}).join('')+'</div><div id="staffmsg" class="notice" hidden></div>'}
function staffOpen(n){let k=staffRestaurant+'/'+n;if(!accounts[k])accounts[k]={paid:0,used:menu.map(()=>0),equal:null};dashboard()}
function staffLink(n){let u=new URL(location.pathname,location.origin);u.searchParams.set('restaurante',staffRestaurant);u.searchParams.set('mesa',n);let m=document.getElementById('staffmsg');m.hidden=false;m.textContent=u.href;if(navigator.clipboard)navigator.clipboard.writeText(u.href).then(()=>m.textContent='Link copiado: '+u.href).catch(()=>{});}
function staffDetail(n){let a=accounts[staffRestaurant+'/'+n],m=document.getElementById('staffmsg');m.hidden=false;m.innerHTML='<h3>Consumos · Mesa '+n+'</h3>'+menu.map((x,i)=>'<div class="row">'+x.q+' × '+x.n+'<b>'+euro(x.q*x.p)+'</b></div>').join('')+'<p>Pago: '+euro(a.paid)+' · Por pagar: '+euro(total-a.paid)+'</p>';m.scrollIntoView({behavior:'smooth'})}
if(new URLSearchParams(location.search).has('mesa'))enter();else home();
</script></body></html>
